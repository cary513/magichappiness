<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尋找魔法微笑 — 1080x1350 動畫預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#080b16; --bg-mid:#101a30; --bg-glow:#1c2c4e;
    --violet:#8a7ef2; --violet-soft:#b4a9ff; --gold:#e3bf5f;
    --cream:#f3efe3; --mist:#3f5c8f;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:#05070d; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond', serif; color:var(--cream); overflow:hidden; }
  .stage{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:16px; max-height:100vh; }
  .frame{ position:relative; width: min(72vh * (4 / 5), 440px); aspect-ratio: 4 / 5; border-radius: 4 cqw; overflow:hidden; background:radial-gradient(120% 90% at 50% 20%, var(--bg-glow) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%); box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.7); container-type: inline-size; }

  .frame-overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 25; pointer-events: none; opacity: 0.75; mix-blend-mode: screen; }
  .scene{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:7 cqw; opacity:0; pointer-events:none; transition:opacity .5s ease; z-index:10; }
  .scene.active{ opacity:1; }

  /* Scene 1: 緩慢放大 + 快速淡出 */
  .bg-silhouette { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0; transition: opacity 0.2s ease-in; transform: scale(1); }
  .scene.active .bg-silhouette { opacity: 1; animation: slowZoom 2.5s ease-out forwards; }
  @keyframes slowZoom { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

  /* Scene 2: 快速淡入 */
  .bg-which3 { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0; transition: opacity 0.3s ease-in; }
  .scene.active .bg-which3 { opacity: 1; }
  
  .scene-2-content { position: absolute; bottom: 6 cqw; left: 50%; transform: translateX(-50%); width: 90%; display: flex; flex-direction: column; align-items: center; gap: 3 cqw; z-index: 5; opacity: 0; transform: translate(-50%, 3 cqw); transition: opacity 0.8s ease 0.4s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s; }
  .scene.active .scene-2-content { opacity: 1; transform: translate(-50%, 0); }

  .cap-title{ font-family:'Playfair Display', serif; font-weight:700; color:var(--cream); font-size:7 cqw; line-height:1.3; text-shadow:0 0 24px rgba(138,126,242,0.55); position: relative; z-index: 3; }
  .cap-sub{ font-size: 4 cqw; color: var(--violet-soft); font-style: italic; opacity: 0; transform: translateY(1 cqw); transition: opacity 0.8s ease, transform 0.8s ease; }
  .scene.active .cap-sub.fade-in-text { opacity: 1; transform: translateY(0); }
  
  .start-btn { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 3.8 cqw; color: var(--bg-deep); background: linear-gradient(135deg, var(--gold), #fff2cc); border: none; padding: 1.4 cqw 4.8 cqw; border-radius: 5 cqw; cursor: pointer; box-shadow: 0 0 20px rgba(227, 191, 95, 0.7); animation: pulseGlow 1.4s ease-in-out infinite; }
  @keyframes pulseGlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  .step-scene { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding-top: 4 cqw; }
  .step-text{ margin-top:10px; font-size:1.05rem; color:var(--violet-soft); font-style:italic; }
  .step-badge{ font-family:'Playfair Display', serif; font-weight:700; font-size:0.85rem; color:var(--bg-deep); background:var(--gold); padding:4px 12px; border-radius:20px; margin-bottom:14px; }
  .mirror{ width:80px; height:110px; border-radius:50% / 40%; border:6px solid var(--gold); background:linear-gradient(160deg, #86c9e6, #2f5f7a); margin-bottom:16px; }
  
  .overlay-btn{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(5,7,13,0.72); cursor:pointer; }
  .overlay-btn.hide{ display:none; }
  .play-circle{ width:58px; height:58px; border-radius:50%; border:1.5px solid var(--gold); color:var(--gold); display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">
    <div class="scene" id="s1"><img src="./sh.jpg" class="bg-silhouette"><div class="cap-title">ARE YOU<br>THE CHOSEN ONE?</div></div>
    <div class="scene" id="s2"><img src="./which_2.jpg" class="bg-which3"><div class="scene-2-content"><div class="cap-sub" id="secretText">接下來發生的事，請不要告訴別人</div><button class="start-btn">START</button></div></div>
    <!-- 其餘場景結構維持不變 -->
    <div class="overlay-btn" id="startOverlay"><div class="play-circle">▶</div><p>播放動畫</p></div>
  </div>
</div>
<script>
  const timeline = [{id:'s1', start:0, end:2.5}, {id:'s2', start:2.5, end:6.5}];
  const DURATION = 18.5;
  let rafId, startTime;
  function setScene(t){
    timeline.forEach(seg=>{ document.getElementById(seg.id).classList.toggle('active', t >= seg.start && t < seg.end); });
    document.getElementById('secretText').classList.toggle('fade-in-text', t >= 2.8 && t < 6.5);
  }
  function loop(ts){
    if(!startTime) startTime = ts;
    let elapsed = (ts - startTime)/1000;
    if(elapsed >= DURATION) startTime = ts;
    setScene(elapsed);
    rafId = requestAnimationFrame(loop);
  }
  function start(){ document.getElementById('startOverlay').classList.add('hide'); startTime = null; rafId = requestAnimationFrame(loop); }
  document.getElementById('startOverlay').addEventListener('click', start);
</script>
</body>
</html>
