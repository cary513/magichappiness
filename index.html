<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尋找魔法微笑 — 1080x1350 動畫預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#080b16;
    --bg-mid:#101a30;
    --bg-glow:#1c2c4e;
    --violet:#8a7ef2;
    --violet-soft:#b4a9ff;
    --gold:#e3bf5f;
    --cream:#f3efe3;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#05070d;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond', serif;
    color:var(--cream);
    overflow:hidden;
  }
  .stage{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:16px; max-height:100vh; }
  
  .frame{
    position:relative;
    width: min(72vh * (4 / 5), 440px);
    aspect-ratio: 4 / 5;
    border-radius: 4 cqw;
    overflow:hidden;
    background:radial-gradient(120% 90% at 50% 20%, var(--bg-glow) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.7);
    container-type: inline-size;
  }

  .frame-overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 25; pointer-events: none; opacity: 0.75; mix-blend-mode: screen; }

  .stars{ position:absolute; inset:0; opacity:0.55; }
  .stars span{ position:absolute; width:0.9 cqw; height:0.9 cqw; background:var(--violet-soft); border-radius:50%; filter:blur(0.3px); animation:twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.25; transform:scale(1);} 50%{opacity:1; transform:scale(1.6);} }
  .moon{ position:absolute; top:6%; left:50%; transform:translateX(-50%); width:7.5 cqw; height:7.5 cqw; border-radius:50%; box-shadow: -2 cqw 0.5 cqw 0 0 var(--bg-deep) inset; background:var(--cream); opacity:.5; }

  .progress-track{ position:absolute; top:3 cqw; left:3 cqw; right:3 cqw; height:1 cqw; background:rgba(255,255,255,0.12); border-radius:1 cqw; overflow:hidden; z-index:26; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--violet), var(--gold)); }

  .scene{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:7 cqw; opacity:0; pointer-events:none; transition:opacity .5s ease; z-index:10; }
  .scene.active{ opacity:1; }

  /* Scene 1 底圖 */
  .bg-silhouette { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0; transition: opacity 1s ease-in-out; }
  .scene.active .bg-silhouette { opacity: 1; }
  .bg-reveal { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; opacity: 0; transition: opacity 1.5s ease-in-out; }
  .scene.active.reveal-face .bg-reveal { opacity: 1; }

  /* Scene 1 標題：無抖動，第 4 秒開始慢慢消失 */
  .cap-title{ 
    font-family:'Playfair Display', serif; 
    font-weight:700; 
    letter-spacing:.03em; 
    text-transform:uppercase; 
    color:var(--cream); 
    font-size:7 cqw; 
    line-height:1.3; 
    text-shadow:0 0 24px rgba(138,126,242,0.55);
    position: relative; 
    z-index: 3;
    transition: opacity 1s ease-in-out;
  }
  .scene.active.fade-title .cap-title {
    opacity: 0;
  }

  /* Scene 2 背景圖片 (which_3.jpg) 及內容排版：貼近底部不擋臉 */
  .bg-which3 { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  
  .scene-2-content {
    position: absolute;
    bottom: 2.5 cqw;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
  }

  .cap-sub{ 
    font-size: 3.6 cqw; 
    color: var(--violet-soft); 
    font-style: italic; 
    line-height: 1.4; 
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    margin-bottom: 1.8 cqw;
    white-space: nowrap;
  }
  
  /* 跳動發光的 START 按鈕設定 */
  .start-btn {
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 3.8 cqw;
    letter-spacing: 0.12em;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--gold), #fff2cc);
    border: none;
    padding: 1.4 cqw 4.8 cqw;
    border-radius: 5 cqw;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(227, 191, 95, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.9);
    animation: pulseGlow 1.4s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(227, 191, 95, 0.6); }
    50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(227, 191, 95, 0.95), 0 0 50px rgba(180, 169, 255, 0.6); }
  }

  .chant{ font-family:'Playfair Display', serif; font-weight:700; font-size:7.5 cqw; color:var(--gold); text-shadow:0 0 20px rgba(227,191,95,0.6); min-height:2.4em; }
  .cta-arrow{ font-size:6 cqw; animation:bounceDown 1.1s ease-in-out infinite; color:var(--gold); margin-top:1.5 cqw; }
  @keyframes bounceDown{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(2 cqw);} }

  .eyes{ font-size:10 cqw; letter-spacing:4 cqw; margin-bottom:3.5 cqw; opacity:.9; }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; z-index:15; }
  .flash.on{ animation:flashPop .5s ease-out forwards; }
  @keyframes flashPop{ 0%{opacity:0;} 15%{opacity:1;} 100%{opacity:0;} }
  .smile-glow{ width:36 cqw; height:36 cqw; border-radius:50%; background:radial-gradient(circle, rgba(180,169,255,0.55), rgba(60,60,120,0) 70%); display:flex; align-items:center; justify-content:center; margin-bottom:3.5 cqw; }
  .smile-path{ font-size:12 cqw; color:var(--gold); text-shadow:0 0 20px rgba(227,191,95,0.8); }

  .badge-sound{ position:absolute; top:3.5 cqw; right:3.5 cqw; z-index:26; font-size:3.2 cqw; color:var(--violet-soft); background:rgba(10,14,26,0.7); border:1px solid rgba(180,169,255,0.4); padding:0.8 cqw 2.2 cqw; border-radius:3 cqw; opacity:0; transition:opacity .3s; }
  .badge-sound.show{ opacity:1; }

  .overlay-btn{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2 cqw; background:rgba(5,7,13,0.78); cursor:pointer; text-align:center; padding:6 cqw; }
  .overlay-btn.hide{ display:none; }
  .play-circle{ width:15 cqw; height:15 cqw; border-radius:50%; border:0.4 cqw solid var(--gold); color:var(--gold); display:flex; align-items:center; justify-content:center; font-size:5.5 cqw; box-shadow:0 0 30px rgba(227,191,95,0.35); }

  .controls{ display:flex; gap:12px; }
  .ctrl-btn{ font-family:'Cormorant Garamond', serif; font-size:1rem; background:transparent; border:1px solid rgba(180,169,255,0.5); color:var(--violet-soft); padding:8px 20px; border-radius:20px; cursor:pointer; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">
    <img src="frame.png" class="frame-overlay">
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    <div class="badge-sound" id="soundBadge">🔊 音量開啟</div>
    <div class="stars" id="starsLayer"></div>
    <div class="moon"></div>

    <!-- Scene 1 : 0-5s Hook -->
    <div class="scene" id="s1">
      <img src="sh.jpg" class="bg-silhouette">
      <div class="cap-title">ARE YOU<br>THE CHOSEN ONE?</div>
    </div>

    <!-- Scene 2 : which_3.jpg + 接下來發生的事，請不要告訴別人 + 發光 START 按鈕 (5秒) -->
    <div class="scene" id="s2">
      <img src="which_3.jpg" class="bg-which3">
      <div class="scene-2-content">
        <div class="cap-sub">接下來發生的事，請不要告訴別人</div>
        <button class="start-btn">START</button>
      </div>
    </div>

    <div class="scene" id="s3">
      <div class="step-badge" style="font-family:'Playfair Display', serif; font-weight:700; font-size:3.6 cqw; color:var(--bg-deep); background:var(--gold); padding:1 cqw 3.5 cqw; border-radius:4 cqw; letter-spacing:.06em; margin-bottom:2 cqw;">STEP 2 / 4</div>
      <div class="finger-icon" style="font-size:14 cqw; margin-bottom:2 cqw;">☝️</div>
      <div class="cap-sub">舉起食指 Raise your index finger</div>
    </div>

    <div class="scene" id="s4">
      <div class="step-badge" style="font-family:'Playfair Display', serif; font-weight:700; font-size:3.6 cqw; color:var(--bg-deep); background:var(--gold); padding:1 cqw 3.5 cqw; border-radius:4 cqw; letter-spacing:.06em; margin-bottom:2 cqw;">STEP 3 / 4</div>
      <div class="cheek-wrap" style="position:relative; width:28 cqw; height:28 cqw; margin-bottom:2 cqw;">
        <div class="cheek-icon" style="font-size:14 cqw;">🫵</div>
      </div>
      <div class="cap-sub">輕觸臉頰 Touch your cheek</div>
    </div>

    <div class="scene" id="s5">
      <div class="step-badge" style="font-family:'Playfair Display', serif; font-weight:700; font-size:3.6 cqw; color:var(--bg-deep); background:var(--gold); padding:1 cqw 3.5 cqw; border-radius:4 cqw; letter-spacing:.06em; margin-bottom:2 cqw;">STEP 4 / 4</div>
      <div class="eyes">〜 〜</div>
      <div class="chant" id="chantText"></div>
    </div>

    <div class="scene" id="s6">
      <div class="flash" id="flashEl"></div>
      <div class="smile-glow"><div class="smile-path">⌣</div></div>
      <div class="cap-title" style="font-size:5.5 cqw;">DID YOU SEE THE MOST<br>BEAUTIFUL SMILE?</div>
    </div>

    <div class="scene" id="s7">
      <div class="cap-title" style="font-size:5.8 cqw;">留言你看到的畫面</div>
      <div class="cta-arrow">↓</div>
      <div class="cap-sub">標記一位也該找到<br>魔法微笑的人 ✨</div>
    </div>

    <div class="overlay-btn" id="startOverlay">
      <div class="play-circle">▶</div>
      <p>播放動畫預覽</p>
    </div>
  </div>
  <div class="controls"><button class="ctrl-btn" id="replayBtn">⟲ 重新播放</button></div>
</div>

<script>
  const timeline = [
    {id:'s1', start:0,  end:5},
    {id:'s2', start:5,  end:10},
    {id:'s3', start:10, end:12},
    {id:'s4', start:12, end:14},
    {id:'s5', start:14, end:16},
    {id:'s6', start:16, end:17.5},
    {id:'s7', start:17.5,end:19}
  ];
  const DURATION = 19;
  let rafId, startTime;
  
  function setScene(t){
    timeline.forEach(seg=>{
      const el = document.getElementById(seg.id);
      el.classList.toggle('active', t >= seg.start && t < seg.end);
    });

    const s1El = document.getElementById('s1');
    s1El.classList.toggle('reveal-face', t >= 3.0 && t < 5);
    s1El.classList.toggle('fade-title', t >= 4.0 && t < 5);

    document.getElementById('flashEl').classList.toggle('on', t>=16 && t<16.6);
  }

  function loop(ts){
    if(!startTime) startTime = ts;
    let elapsed = (ts - startTime)/1000;
    if(elapsed >= DURATION){ startTime = ts; elapsed = 0; }
    document.getElementById('progress').style.width = (elapsed/DURATION*100)+'%';
    setScene(elapsed);
    rafId = requestAnimationFrame(loop);
  }

  function start(){ document.getElementById('startOverlay').classList.add('hide'); startTime = null; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop); }
  document.getElementById('startOverlay').addEventListener('click', start);
  document.getElementById('replayBtn').addEventListener('click', start);
</script>
</body>
</html>
